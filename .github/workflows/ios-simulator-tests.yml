name: iOS Simulator Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "SmartOilaKids/**"
      - "SmartOilaKidsTests/**"
      - "Shared/**"
      - "SmartOilaKidsUsageReportExtension/**"
      - "SmartOilaKidsScheduleMonitorExtension/**"
      - "SmartOilaKids.xcodeproj/**"
      - "project.yml"
      - "scripts/run_ios_tests.sh"
      - ".github/workflows/ios-simulator-tests.yml"
  pull_request:
    paths:
      - "SmartOilaKids/**"
      - "SmartOilaKidsTests/**"
      - "Shared/**"
      - "SmartOilaKidsUsageReportExtension/**"
      - "SmartOilaKidsScheduleMonitorExtension/**"
      - "SmartOilaKids.xcodeproj/**"
      - "project.yml"
      - "scripts/run_ios_tests.sh"
      - ".github/workflows/ios-simulator-tests.yml"

concurrency:
  group: ios-simulator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: List Available iOS Simulators
        run: xcrun simctl list devices available

      - name: Provide GoogleService-Info.plist for the build
        # The real plist is gitignored (this repo is PUBLIC and it carries a live API key), but the
        # app target's Resources phase lists it by NAME — so a clean checkout failed on a missing
        # build input before a single test ran. Copy the committed placeholder in when the real file
        # is absent. Its BUNDLE_ID is deliberately wrong, so `FCMPushRegistrar.configureIfPossible()`
        # refuses to configure Firebase against it (`.bundleMismatch`) rather than coming up pointed
        # at a fake project. The `-f` test means a runner that DOES have the real file is untouched.
        run: |
          real=SmartOilaKids/Resources/GoogleService-Info.plist
          if [ ! -f "$real" ]; then
            cp SmartOilaKids/Resources/GoogleService-Info.sample.plist "$real"
            echo "Using the CI placeholder GoogleService-Info.plist."
          fi

      - name: Compile Screen Time extensions
        # The extensions aren't embedded in the app target (Screen Time ships disabled in v1), so the
        # app scheme never builds them. Compile them explicitly so their sources can't silently
        # bit-rot before the enforcement release.
        # `-target` and `-destination` do not combine: xcodebuild logs "Ignoring provided run
        # destination because no scheme was passed", falls back to the DEVICE SDK, and then dies on
        # "No profiles for 'uz.smartoila.kids.schedule-monitor' were found" (exit 65). That is why
        # this job has been red on every run since 3b51a7d and the test step below never executed.
        # Select the simulator SDK explicitly and disable signing instead.
        run: |
          xcodebuild build \
            -project SmartOilaKids.xcodeproj \
            -target SmartOilaKidsScheduleMonitorExtension \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO -quiet
          xcodebuild build \
            -project SmartOilaKids.xcodeproj \
            -target SmartOilaKidsUsageReportExtension \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Run SmartOilaKids Simulator Tests
        run: ./scripts/run_ios_tests.sh

      - name: Upload Xcode Result Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartoila-kids-xcresult
          path: .build/test-results/SmartOilaKids.xcresult
          if-no-files-found: ignore

      - name: Upload Xcodebuild Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartoila-kids-xcodebuild-log
          path: .build/test-results/ios-tests.log
          if-no-files-found: ignore
