name: Child OpenAPI Baseline

on:
  push:
    paths:
      - "SmartOilaKids/**"
      - "OpenAPI/**"
      - "scripts/check_openapi_coverage.py"
      - "scripts/check_child_openapi_baseline.py"
      - "scripts/tests/**"
      - ".github/workflows/openapi-child-baseline.yml"
  pull_request:
    paths:
      - "SmartOilaKids/**"
      - "OpenAPI/**"
      - "scripts/check_openapi_coverage.py"
      - "scripts/check_child_openapi_baseline.py"
      - "scripts/tests/**"
      - ".github/workflows/openapi-child-baseline.yml"

jobs:
  child-openapi-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scripts test suite
        run: ./scripts/run_script_tests.sh

      - name: Enforce child OpenAPI baseline (legacy spec)
        # NOTE: this validates against rest_openapi.json, which describes the DECOMMISSIONED
        # backend, and its threshold is derived from the contract file it measures -- so it cannot
        # fail on a real integration break. Kept only so the legacy surface does not rot; the gate
        # that actually protects the live integration is the next step.
        run: |
          python3 scripts/check_child_openapi_baseline.py \
            --rest-spec OpenAPI/rest_openapi.json \
            --ws-spec OpenAPI/ws_openapi.json

      - name: Enforce child endpoints against the LIVE spec
        # Floor is pinned HERE, in the workflow, not read out of the data -- narrowing the contract
        # until it passes has to fail the build instead. Raise it when call sites are added.
        # The unit is METHOD+path, so the distinct paths the client calls are fewer than the floor.
        #
        # 26 as of 2026-08-27: 24 -> 25 when POST /device/unpair was added (D3), -> 26 with
        # GET /device/home, briefly -> 27 with the public GET /api/v1/app-config (store-review mode),
        # and back to 26 when that call site was DELETED. The flag hid live audio/video from App
        # Review only, which Apple forbids outright, so the endpoint is no longer called. Lowering a
        # ratchet is the one move it cannot police itself — this is deliberate, and the deleted call
        # site is the reason.
        # `/device/unpair` is counted honestly but is deliberately NOT in the snapshot: the server
        # 404s every verb on it, and the snapshot only ever describes what the live server answers.
        # Its exemption lives in `DECLARED_AHEAD_OF_DEPLOYMENT` in check_child_live_endpoints.py,
        # which PRINTS it on every run -- the gate's job is to notice the gap, not look away from
        # it. See OpenAPI/README.md.
        run: |
          python3 scripts/check_child_live_endpoints.py --min-endpoints 26
